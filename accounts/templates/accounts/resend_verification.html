{% extends 'accounts/base.html' %}

{% block title %}Resend Email Verification - EduVerse AI Kids{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="glass-card p-4 p-md-5 border-0 shadow-lg text-center">

        <div class="d-inline-flex p-3 rounded-circle bg-info-subtle text-info mb-3">
          <i class="bi bi-envelope-check fs-1 text-info"></i>
        </div>

        <h3 class="fw-bold mb-2">Resend Email Verification</h3>
        <p class="text-muted fs-7 mb-4">Enter your registered email address below and we'll send you a new verification link.</p>

        <form method="post" action="{% url 'resend_verification' %}">
          {% csrf_token %}
          <div class="mb-3 text-start">
            <label for="resend-email" class="form-label fw-semibold fs-7">Email Address</label>
            <input type="email" name="email" id="resend-email" class="form-control rounded-pill glass-input" placeholder="alex@example.com" required>
          </div>

          <button type="submit" class="btn btn-edu-primary w-100 py-2.5 fs-6 shadow">
            Send Verification Link <i class="bi bi-send ms-1"></i>
          </button>
        </form>

        <div class="mt-4 border-top pt-3">
          <a href="{% url 'login' %}" class="text-decoration-none text-muted fs-7"><i class="bi bi-arrow-left me-1"></i> Back to Login</a>
        </div>

      </div>
    </div>
  </div>
</div>
{% endblock %}
